    // Componente para renderizar texto mezclado con LaTeX usando KaTeX
    function MathText({ text }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.katex) return;

        // Limpiar contenido previo
        containerRef.current.innerHTML = "";

        // Separar texto normal de bloques de fórmulas ($$ Bloque $$ y $ Inline $)
        const regex = /(\$\$.*?\$\$|\$.*?\$)/gs;
        const parts = text.split(regex);

        parts.forEach(part => {
          if (part.startsWith('$$') && part.endsWith('$$')) {
            const math = part.slice(2, -2);
            const span = document.createElement('div');
            try {
              window.katex.render(math, span, { displayMode: true, throwOnError: false });
            } catch (e) {
              span.textContent = part;
            }
            containerRef.current.appendChild(span);
          } else if (part.startsWith('$') && part.endsWith('$')) {
            const math = part.slice(1, -1);
            const span = document.createElement('span');
            try {
              window.katex.render(math, span, { displayMode: false, throwOnError: false });
            } catch (e) {
              span.textContent = part;
            }
            containerRef.current.appendChild(span);
          } else {
            const span = document.createElement('span');
            span.innerText = part;
            containerRef.current.appendChild(span);
          }
        });
      }, [text]);

      return <div ref={containerRef} className="whitespace-pre-line leading-relaxed text-slate-800 font-serif font-medium" />;
    }

      const GEO_STORAGE_KEY = "geo_parcial_app_v2";

        return PROBA_BLOCKS;

        const saved = localStorage.getItem(GEO_STORAGE_KEY);
        if (saved) return JSON.parse(saved);
        return GEO_BLOCKS;
      });

      const [copied, setCopied] = useState(false);
      const [statusFilter, setStatusFilter] = useState('all');

      useEffect(() => {
        localStorage.setItem(PROBA_STORAGE_KEY, JSON.stringify(probaBlocks));
      }, [probaBlocks]);

      useEffect(() => {
        localStorage.setItem(GEO_STORAGE_KEY, JSON.stringify(geoBlocks));
      }, [geoBlocks]);

      const currentBlocks = selectedSubject === 'prob' ? probaBlocks : selectedSubject === 'geo' ? geoBlocks : [];
      const setCurrentBlocks = selectedSubject === 'prob' ? setProbaBlocks : setGeoBlocks;

      const updateState = (blockId, exId, newState) => {
        setCurrentBlocks(prev => prev.map(b => b.id === blockId ? {
          ...b,
          exercises: b.exercises.map(e => e.id === exId ? { ...e, state: newState } : e)
        } : b));
      };

      const updateComment = (blockId, exId, newComment) => {
        setCurrentBlocks(prev => prev.map(b => b.id === blockId ? {
          ...b,
          exercises: b.exercises.map(e => e.id === exId ? { ...e, comment: newComment } : e)
        } : b));
      };

      const handleReset = () => {
        if (window.confirm("¿Deseas reiniciar todo tu progreso y comentarios de esta asignatura?")) {
          if (selectedSubject === 'prob') {
            setProbaBlocks(PROBA_BLOCKS);
            localStorage.removeItem(PROBA_STORAGE_KEY);
          } else if (selectedSubject === 'geo') {
            setGeoBlocks(GEO_BLOCKS);
            localStorage.removeItem(GEO_STORAGE_KEY);
          }
        }
      };

      const allExercises = currentBlocks.flatMap(b => b.exercises);
      const easyCount = allExercises.filter(e => e.state === 'easy').length;
      const doubtCount = allExercises.filter(e => e.state === 'doubt').length;
      const pendingCount = allExercises.filter(e => e.state === 'pending').length;
      const totalCompleted = easyCount + doubtCount;
      const progressPercent = allExercises.length > 0 ? Math.round((totalCompleted / allExercises.length) * 100) : 0;

      const generateSummaryMarkdown = () => {
        const subjectName = selectedSubject === 'prob' ? 'Probabilitats' : 'Geometria Diferencial de Corbes i Superfícies';
        let md = `### 📊 RESUMEN DE PROGRESO - ${subjectName.toUpperCase()}\n`;
        md += `**Progreso global:** ${progressPercent}% (${totalCompleted}/${allExercises.length} resueltos)\n`;
        md += `🟢 Fácil/Dominados: ${easyCount} | 🟡 Con dudas/difícil: ${doubtCount} | ⚪ Pendientes: ${pendingCount}\n\n`;

        currentBlocks.forEach(b => {
          md += `#### ${b.title}\n`;
          b.exercises.forEach(e => {
            const icon = e.state === 'easy' ? '🟢 [FÁCIL]' : e.state === 'doubt' ? '🟡 [CON DUDAS]' : '⚪ [PENDIENTE]';
            md += `- **${e.list} ${e.num}** (${e.title}): ${icon}\n`;
            if (e.comment.trim()) {
              md += `  > *Comentario/Duda:* ${e.comment.trim()}\n`;
            }
          });
          md += `\n`;
        });
        return md;
      };

                >
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                      <span>🎲</span> Parcial Probabilitats
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-400 group-hover:text-indigo-100 mt-1">
                      27 ejercicios seleccionados • Renderizado matemático activo
                    </p>
                  </div>
                  <span className="text-2xl text-indigo-400 group-hover:text-white transition-transform">→</span>
                </button>

                <button 
                  onClick={() => setSelectedSubject('geo')}
                  className="w-full group p-5 bg-gradient-to-r from-purple-950/60 via-slate-800 to-purple-900/40 hover:from-purple-600 hover:to-pink-600 border border-purple-500/30 hover:border-purple-400 rounded-xl transition-all duration-300 flex items-center justify-between shadow-lg cursor-pointer"
                >
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                      <span>🌐</span> Parcial Geometria Diferencial
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-400 group-hover:text-purple-100 mt-1">
                      20 ejercicios en LaTeX • Renderizado matemático activo
                    </p>
                  </div>
                  <span className="text-2xl text-purple-400 group-hover:text-white transition-transform">→</span>
                </button>

                <button 
                  onClick={() => setSelectedSubject('analisi')}
                  className="w-full group p-5 bg-slate-800/40 hover:bg-slate-700/50 border border-slate-700/80 rounded-xl transition-all duration-200 flex items-center justify-between cursor-pointer"
                >
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-slate-300 group-hover:text-white flex items-center gap-2">
                      <span>📐</span> Parcial Anàlisi Matemàtic
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-500 group-hover:text-slate-300 mt-1">
                      Módulo en preparación (plantilla vacía lista para cargar)
                    </p>
                  </div>
                  <span className="text-xs font-semibold px-2.5 py-1 bg-slate-700/80 text-slate-400 rounded-md">Próximamente</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (selectedSubject === 'analisi') {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center shadow-xl">
              <span className="text-4xl mb-4 block">🛠️</span>
              <h2 className="text-2xl font-bold text-white mb-2">Parcial Anàlisi Matemàtic</h2>
              <p className="text-slate-400 text-sm mb-6">
                Esta plantilla está lista para alojar los problemas cuando carguemos los exámenes de esta materia.
              </p>
              <button 
                onClick={() => setSelectedSubject(null)}
                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition cursor-pointer flex items-center gap-2 mx-auto"
              >
                ← Volver al menú
              </button>
            </div>
          </div>
        );
      }

      const isGeo = selectedSubject === 'geo';

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans p-3 sm:p-6 pb-24">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* HEADER */}
            <header className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 pb-4 pt-2">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                  <button 
                    onClick={() => setSelectedSubject(null)}
                    className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 mb-1 font-medium cursor-pointer"
                  >
                    ← Cambiar de Parcial
                  </button>
                  <h1 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                    <span>{isGeo ? "🌐" : "🎲"}</span> Preparación Parcial {isGeo ? "Geometria Diferencial" : "Probabilitats"}
                  </h1>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={handleCopy}
                    className={`px-4 py-2.5 rounded-xl font-bold transition-all shadow-lg flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer ${
                      copied 
                        ? "bg-emerald-600 text-white scale-105" 
                        : isGeo 
                          ? "bg-purple-600 hover:bg-purple-500 text-white shadow-purple-900/40"
                          : "bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/40"
                    }`}
                  >
                    <span>{copied ? "¡Copiado al portapapeles!" : "📋 Analizar los resultados"}</span>
                  </button>

                  <button
                    onClick={handleReset}
                    title="Reiniciar todo el progreso"
                    className="p-2.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-xl transition border border-slate-700 cursor-pointer text-xs"
                  >
                    🔄
                  </button>
                </div>
              </div>

              {/* BARRA DE PROGRESO */}
              <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 shadow-lg">
                <div className="flex justify-between items-center text-xs sm:text-sm font-semibold text-slate-300 mb-2">
                  <span>Progreso global: <strong>{totalCompleted} / {allExercises.length}</strong> ej.</span>
                  <span className={`${isGeo ? "text-purple-400" : "text-indigo-400"} font-bold`}>{progressPercent}%</span>
                </div>

                <div className="w-full h-3 bg-slate-950 rounded-full overflow-hidden flex border border-slate-700/50 p-0.5">
                  <div style={{ width: `${(easyCount / allExercises.length) * 100}%` }} className="bg-emerald-500 rounded-l-full transition-all duration-300"></div>
                  <div style={{ width: `${(doubtCount / allExercises.length) * 100}%` }} className="bg-amber-500 transition-all duration-300"></div>
                </div>

                <div className="flex flex-wrap gap-4 text-xs mt-3 text-slate-400">
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 
                    Fácil / Sin problemas: {easyCount}
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 
                    Con dudas: {doubtCount}
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-slate-600"></span> 
                    Pendientes: {pendingCount}
                  </span>
                </div>
              </div>
            </header>

            {/* CONTROLES / FILTROS */}
            <div className="flex items-center justify-between bg-slate-800/50 p-3.5 rounded-xl border border-slate-700/70 text-xs">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-slate-400 uppercase tracking-wider">Filtrar por estado:</span>
                <select
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none focus:border-indigo-500"
                >
                  <option value="all">Todos los ejercicios</option>
                  <option value="pending">Solo pendientes</option>
                  <option value="easy">🟢 Resueltos fácil</option>
                  <option value="doubt">🟡 Con dudas</option>
                </select>
              </div>
            </div>

            {/* LISTADO DE BLOQUES */}
            <div className="space-y-6">
              {currentBlocks.map(block => {
                const filteredExercises = block.exercises.filter(ex => {
                  if (statusFilter === 'pending') return ex.state === 'pending';
                  if (statusFilter === 'easy') return ex.state === 'easy';
                  if (statusFilter === 'doubt') return ex.state === 'doubt';
                  return true;
                });

                if (filteredExercises.length === 0 && statusFilter !== 'all') return null;

                return (
                  <div key={block.id} className={`border rounded-2xl p-5 shadow-xl transition-all ${block.cardBg}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className={`text-sm sm:text-base font-bold px-3 py-1.5 rounded-lg border ${block.headerBg}`}>
                        {block.title}
                      </h2>
                      <span className="text-xs font-mono text-slate-400">
                        {block.exercises.filter(e => e.state !== 'pending').length} / {block.exercises.length} resueltos
                      </span>
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                      {filteredExercises.map(ex => (
                        <div 
                          key={ex.id} 
                          className="bg-slate-900/90 border border-slate-800 rounded-xl p-4.5 hover:border-slate-700 transition-colors"
                        >
                          {/* ENCABEZADO Y BOTONES DE ESTADO */}
                          <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-3">
                            <div className="space-y-1">
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded border ${
                                  isGeo 
                                    ? "bg-purple-950 text-purple-300 border-purple-700/50" 
                                    : "bg-indigo-950 text-indigo-300 border-indigo-700/50"
                                }`}>
                                  {ex.list} - {ex.num}
                                </span>
                                <h3 className="font-semibold text-slate-100 text-sm">{ex.title}</h3>
                              </div>
                              <p className="text-xs text-slate-400">{ex.desc}</p>
                            </div>

                            {/* SELECTOR DE ESTADO */}
                            <div className="flex items-center gap-1.5 self-start shrink-0 bg-slate-950 p-1 rounded-xl border border-slate-800">
                              <button
                                onClick={() => updateState(block.id, ex.id, 'easy')}
                                className={`px-2.5 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer flex items-center gap-1 ${
                                  ex.state === 'easy' ? "bg-emerald-600 text-white font-bold" : "text-slate-400 hover:text-emerald-300"
                                }`}
                              >
                                <span>🟢 Fácil</span>
                              </button>
                              <button
                                onClick={() => updateState(block.id, ex.id, 'doubt')}
                                className={`px-2.5 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer flex items-center gap-1 ${
                                  ex.state === 'doubt' ? "bg-amber-600 text-white font-bold" : "text-slate-400 hover:text-amber-300"
                                }`}
                              >
                                <span>🟡 Con dudas</span>
                              </button>
                              <button
                                onClick={() => updateState(block.id, ex.id, 'pending')}
                                className={`px-2 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer ${
                                  ex.state === 'pending' ? "bg-slate-700 text-slate-200" : "text-slate-500 hover:text-slate-300"
                                }`}
                              >
                                ⚪ Pendiente
                              </button>
                            </div>
                          </div>

                          {/* RECUADRO DEL ENUNCIADO CON KATEX */}
                          <div className="mb-3.5 p-4 rounded-xl bg-white border border-slate-300 shadow-md text-slate-900">
                            <div className="flex items-center gap-1.5 mb-2 text-xs font-bold text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-1">
                              <span>📄 Enunciado del problema</span>
                            </div>
                            <MathText text={ex.statement} />
                          </div>

                          {/* COMENTARIO / OBSERVACIONES */}
                          <div className="mt-2">
                            <textarea
                              placeholder="Añadir observaciones o dudas sobre la resolución..."
                              value={ex.comment}
                              onChange={(e) => updateComment(block.id, ex.id, e.target.value)}
                              className="w-full text-xs bg-slate-950/70 border border-slate-800 rounded-lg p-2.5 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors resize-y min-h-[50px]"
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* PIE DE PÁGINA */}
            <footer className="mt-8 text-center bg-slate-800/60 rounded-2xl p-5 border border-slate-700/80">
              <p className="text-xs text-slate-400 mb-3">
                Cuando resuelvas algunos ejercicios, haz clic en el botón para copiar el resumen y pegarlo en el chat para analizar tu avance.
              </p>
              <button
                onClick={handleCopy}
                className={`px-6 py-3 rounded-xl font-bold transition-all shadow-xl text-xs sm:text-sm cursor-pointer ${
                  copied 
                    ? "bg-emerald-600 text-white scale-105" 
                    : isGeo
                      ? "bg-purple-600 hover:bg-purple-500 text-white shadow-purple-900/50"
                      : "bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/50"
                }`}
              >
                {copied ? "✓ Resumen copiado al portapapeles" : "📋 Analizar los resultados"}
              </button>
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
