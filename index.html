    // Componente para renderizar texto mezclado con LaTeX usando KaTeX
    function MathText({ text }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.katex) return;
        containerRef.current.innerHTML = "";

        const regex = /(\$\$.*?\$\$|\$.*?\$)/gs;
        const parts = text.split(regex);

        parts.forEach(part => {
          if (part.startsWith('$$') && part.endsWith('$$')) {
            const math = part.slice(2, -2);
            const span = document.createElement('div');
            try {
              window.katex.render(math, span, { displayMode: true, throwOnError: false });
            } catch (e) {
              span.textContent = part;
            }
            containerRef.current.appendChild(span);
          } else if (part.startsWith('$') && part.endsWith('$')) {
            const math = part.slice(1, -1);
            const span = document.createElement('span');
            try {
              window.katex.render(math, span, { displayMode: false, throwOnError: false });
            } catch (e) {
              span.textContent = part;
            }
            containerRef.current.appendChild(span);
          } else {
            const span = document.createElement('span');
            span.innerText = part;
            containerRef.current.appendChild(span);
          }
        });
      }, [text]);

      return <div ref={containerRef} className="whitespace-pre-line leading-relaxed text-slate-800 font-serif font-medium" />;
    }

    // CARGA Y MIGRACIÓN PERSISTENTE DE DATOS DESDE LOCALSTORAGE
    function loadAndMigrateData(finalKey, defaultBlocks) {
      const savedFinal = localStorage.getItem(finalKey);
      if (savedFinal) {
        try { return JSON.parse(savedFinal); } catch(e){}
      }
      return defaultBlocks;
    }

    function App() {
      const PROBA_FINAL_KEY = "parciales_app_proba_v_final";
      const GEO_FINAL_KEY = "parciales_app_geo_v_final";
      const ANALISI_FINAL_KEY = "parciales_app_analisi_v_final";

      const [selectedSubject, setSelectedSubject] = useState(null); // 'prob', 'geo', 'analisi'
      const [examType, setExamType] = useState('parcial');          // 'parcial', 'final', 'grades'
      const [statusFilter, setStatusFilter] = useState('all');
      const [copied, setCopied] = useState(false);

      const [probaBlocks, setProbaBlocks] = useState(() => loadAndMigrateData(PROBA_FINAL_KEY, PROBA_BLOCKS));
      const [geoBlocks, setGeoBlocks] = useState(() => loadAndMigrateData(GEO_FINAL_KEY, GEO_BLOCKS));
      const [analisiBlocks, setAnalisiBlocks] = useState(() => loadAndMigrateData(ANALISI_FINAL_KEY, ANALISI_BLOCKS));

      // Estados para la Calculadora de Notas
      const [continuaNote, setContinuaNote] = useState('');
      const [parcialNote, setParcialNote] = useState('');
      const [targetGrade, setTargetGrade] = useState('5.0');
      const [finalNeeded, setFinalNeeded] = useState(null);

      useEffect(() => { localStorage.setItem(PROBA_FINAL_KEY, JSON.stringify(probaBlocks)); }, [probaBlocks]);
      useEffect(() => { localStorage.setItem(GEO_FINAL_KEY, JSON.stringify(geoBlocks)); }, [geoBlocks]);
      useEffect(() => { localStorage.setItem(ANALISI_FINAL_KEY, JSON.stringify(analisiBlocks)); }, [analisiBlocks]);

      const currentBlocks = selectedSubject === 'prob' ? probaBlocks : selectedSubject === 'geo' ? geoBlocks : selectedSubject === 'analisi' ? analisiBlocks : [];
      const setCurrentBlocks = selectedSubject === 'prob' ? setProbaBlocks : selectedSubject === 'geo' ? setGeoBlocks : setAnalisiBlocks;

      const updateState = (blockId, exId, newState) => {
        setCurrentBlocks(prev => prev.map(b => b.id === blockId ? {
          ...b,
          exercises: b.exercises.map(e => e.id === exId ? { ...e, state: newState } : e)
        } : b));
      };

      const updateComment = (blockId, exId, newComment) => {
        setCurrentBlocks(prev => prev.map(b => b.id === blockId ? {
          ...b,
          exercises: b.exercises.map(e => e.id === exId ? { ...e, comment: newComment } : e)
        } : b));
      };

      const handleReset = () => {
        if (window.confirm("¿Deseas reiniciar todo tu progreso de esta asignatura?")) {
          if (selectedSubject === 'prob') {
            setProbaBlocks(PROBA_BLOCKS);
            localStorage.removeItem(PROBA_FINAL_KEY);
          } else if (selectedSubject === 'geo') {
            setGeoBlocks(GEO_BLOCKS);
            localStorage.removeItem(GEO_FINAL_KEY);
          } else if (selectedSubject === 'analisi') {
            setAnalisiBlocks(ANALISI_BLOCKS);
            localStorage.removeItem(ANALISI_FINAL_KEY);
          }
        }
      };

      const allExercises = currentBlocks.flatMap(b => b.exercises);
      const easyCount = allExercises.filter(e => e.state === 'easy').length;
      const doubtCount = allExercises.filter(e => e.state === 'doubt').length;
      const pendingCount = allExercises.filter(e => e.state === 'pending').length;
      const totalCompleted = easyCount + doubtCount;
      const progressPercent = allExercises.length > 0 ? Math.round((totalCompleted / allExercises.length) * 100) : 0;

      const getSubjectName = () => {
        if (selectedSubject === 'prob') return 'Probabilitats';
        if (selectedSubject === 'geo') return 'Geometria Diferencial';
        if (selectedSubject === 'analisi') return 'Anàlisi Matemàtica';
        return '';
      };

      const calculateNeededGrade = () => {
        const cont = parseFloat(continuaNote) || 0;
        const parc = parseFloat(parcialNote) || 0;
        const target = parseFloat(targetGrade) || 5.0;
        // Ponderación de ejemplo: 20% evaluación continua + 30% parcial + 50% examen final
        const needed = (target - (0.2 * cont) - (0.3 * parc)) / 0.5;
        setFinalNeeded(Math.max(0, Math.min(10, needed)).toFixed(2));
      };

      const generateSummaryMarkdown = () => {
        let md = `### 📊 RESUMEN DE PROGRESO - ${getSubjectName().toUpperCase()}\n`;
        md += `**Progreso global:** ${progressPercent}% (${totalCompleted}/${allExercises.length} resueltos)\n`;
        md += `🟢 Fácil/Dominados: ${easyCount} | 🟡 Con dudas: ${doubtCount} | ⚪ Pendientes: ${pendingCount}\n\n`;

        currentBlocks.forEach(b => {
          md += `#### ${b.title}\n`;
          b.exercises.forEach(e => {
            const icon = e.state === 'easy' ? '🟢 [FÁCIL]' : e.state === 'doubt' ? '🟡 [CON DUDAS]' : '⚪ [PENDIENTE]';
            md += `- **${e.list} ${e.num}** (${e.title}): ${icon}\n`;
            if (e.comment.trim()) {
              md += `  > *Comentario/Duda:* ${e.comment.trim()}\n`;
            }
          });
          md += `\n`;
        });
        return md;
      };

      const handleCopy = () => {
        const text = generateSummaryMarkdown();
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      // VISTA 1: INTERFAZ DE BIENVENIDA (LA GABARDINA)
      if (!selectedSubject) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-3xl w-full bg-slate-800/90 border border-slate-700 rounded-2xl p-6 sm:p-10 shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4">
                  <span className="text-3xl">🎓</span>
                </div>
                <h1 className="text-2xl sm:text-4xl font-extrabold text-white mb-2">¡Hola Alex! 👋</h1>
                <p className="text-slate-400 text-sm sm:text-base">¿Qué asignatura nos toca trabajar hoy?</p>
              </div>
              
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {/* PROBABILITATS */}
                <button 
                  onClick={() => { setSelectedSubject('prob'); setExamType('parcial'); }}
                  className="group p-6 bg-gradient-to-b from-indigo-950/60 to-slate-800 hover:from-indigo-600 hover:to-indigo-700 border border-indigo-500/30 hover:border-indigo-400 rounded-2xl transition-all duration-300 text-left shadow-lg cursor-pointer"
                >
                  <div className="text-3xl mb-3">🎲</div>
                  <h2 className="text-lg font-bold text-white mb-1">Probabilitats</h2>
                  <p className="text-xs text-slate-400 group-hover:text-indigo-100">27 Ejercicios • Parcial & Final</p>
                </button>

                {/* GEOMETRIA DIFERENCIAL */}
                <button 
                  onClick={() => { setSelectedSubject('geo'); setExamType('parcial'); }}
                  className="group p-6 bg-gradient-to-b from-purple-950/60 to-slate-800 hover:from-purple-600 hover:to-purple-700 border border-purple-500/30 hover:border-purple-400 rounded-2xl transition-all duration-300 text-left shadow-lg cursor-pointer"
                >
                  <div className="text-3xl mb-3">🌐</div>
                  <h2 className="text-lg font-bold text-white mb-1">Geometria Dif.</h2>
                  <p className="text-xs text-slate-400 group-hover:text-purple-100">20 Ejercicios • Parcial & Final</p>
                </button>

                {/* ANÀLISI MATEMÀTICA */}
                <button 
                  onClick={() => { setSelectedSubject('analisi'); setExamType('parcial'); }}
                  className="group p-6 bg-gradient-to-b from-teal-950/60 to-slate-800 hover:from-teal-600 hover:to-teal-700 border border-teal-500/30 hover:border-teal-400 rounded-2xl transition-all duration-300 text-left shadow-lg cursor-pointer"
                >
                  <div className="text-3xl mb-3">📐</div>
                  <h2 className="text-lg font-bold text-white mb-1">Anàlisi Mat.</h2>
                  <p className="text-xs text-slate-400 group-hover:text-teal-100">Enunciados completos • Parcial & Final</p>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // VISTA 2: ASIGNATURA SELECCIONADA CON MODALIDADES (LA CHAQUETA Y EL JERSEY)
      const isGeo = selectedSubject === 'geo';
      const isAnalisi = selectedSubject === 'analisi';

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans p-3 sm:p-6 pb-24">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* ENCABEZADO CON CONMUTADOR PARCIAL / FINAL / NOTAS */}
            <header className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 pb-4 pt-2">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                  <button 
                    onClick={() => setSelectedSubject(null)}
                    className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 mb-1 font-medium cursor-pointer"
                  >
                    ← Cambiar de Asignatura
                  </button>
                  <h1 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                    <span>{isAnalisi ? "📐" : isGeo ? "🌐" : "🎲"}</span> {getSubjectName()}
                  </h1>
                </div>

                {/* SELECCIÓN DE PESTAÑAS */}
                <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700 self-stretch sm:self-auto justify-between">
                  <button
                    onClick={() => setExamType('parcial')}
                    className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer ${
                      examType === 'parcial' ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"
                    }`}
                  >
                    📝 Parcial
                  </button>
                  <button
                    onClick={() => setExamType('final')}
                    className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer ${
                      examType === 'final' ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"
                    }`}
                  >
                    🎯 Final
                  </button>
                  <button
                    onClick={() => setExamType('grades')}
                    className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer ${
                      examType === 'grades' ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"
                    }`}
                  >
                    📊 Calculadora Notas
                  </button>
                </div>
              </div>

              {/* VISTA PARCIAL: BARRA DE PROGRESO COMPLETA */}
              {examType === 'parcial' && (
                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 shadow-lg">
                  <div className="flex justify-between items-center text-xs sm:text-sm font-semibold text-slate-300 mb-2">
                    <span>Progreso del Parcial: <strong>{totalCompleted} / {allExercises.length}</strong> ej.</span>
                    <span className="text-indigo-400 font-bold">{progressPercent}%</span>
                  </div>

                  <div className="w-full h-3 bg-slate-950 rounded-full overflow-hidden flex border border-slate-700/50 p-0.5">
                    <div style={{ width: `${(easyCount / allExercises.length) * 100}%` }} className="bg-emerald-500 rounded-l-full transition-all duration-300"></div>
                    <div style={{ width: `${(doubtCount / allExercises.length) * 100}%` }} className="bg-amber-500 transition-all duration-300"></div>
                  </div>

                  <div className="flex flex-wrap justify-between items-center text-xs mt-3 text-slate-400">
                    <div className="flex gap-4">
                      <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Fácil: {easyCount}</span>
                      <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Dudas: {doubtCount}</span>
                      <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-600"></span> Pendientes: {pendingCount}</span>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={handleCopy} className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition cursor-pointer">
                        {copied ? "¡Copiado!" : "📋 Copiar Resumen"}
                      </button>
                      <button onClick={handleReset} className="px-2 py-1 border border-slate-700 text-slate-400 hover:text-white rounded-lg transition text-xs cursor-pointer">
                        🔄
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </header>

            {/* SECCIÓN 1: VISTA DEL PARCIAL (EL JERSEY CON TODOS TUS EJERCICIOS REALES Y ESTADOS) */}
            {examType === 'parcial' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-slate-800/50 p-3.5 rounded-xl border border-slate-700/70 text-xs">
                  <span className="font-semibold text-slate-400 uppercase tracking-wider">Filtrar ejercicios:</span>
                  <select
                    value={statusFilter}
                    onChange={(e) => setStatusFilter(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none focus:border-indigo-500"
                  >
                    <option value="all">Todos los ejercicios</option>
                    <option value="pending">Solo pendientes</option>
                    <option value="easy">🟢 Resueltos fácil</option>
                    <option value="doubt">🟡 Con dudas</option>
                  </select>
                </div>

                {currentBlocks.map(block => {
                  const filteredExercises = block.exercises.filter(ex => {
                    if (statusFilter === 'pending') return ex.state === 'pending';
                    if (statusFilter === 'easy') return ex.state === 'easy';
                    if (statusFilter === 'doubt') return ex.state === 'doubt';
                    return true;
                  });

                  if (filteredExercises.length === 0 && statusFilter !== 'all') return null;

                  return (
                    <div key={block.id} className={`border rounded-2xl p-5 shadow-xl ${block.cardBg}`}>
                      <div className="flex items-center justify-between mb-4">
                        <h2 className={`text-sm sm:text-base font-bold px-3 py-1.5 rounded-lg border ${block.headerBg}`}>
                          {block.title}
                        </h2>
                        <span className="text-xs font-mono text-slate-400">
                          {block.exercises.filter(e => e.state !== 'pending').length} / {block.exercises.length} resueltos
                        </span>
                      </div>

                      <div className="grid grid-cols-1 gap-4">
                        {filteredExercises.map(ex => (
                          <div key={ex.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-4.5 hover:border-slate-700 transition-colors">
                            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-3">
                              <div className="space-y-1">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="text-xs font-mono font-bold px-2 py-0.5 rounded border bg-slate-950 text-slate-300 border-slate-700/50">
                                    {ex.list} - {ex.num}
                                  </span>
                                  <h3 className="font-semibold text-slate-100 text-sm">{ex.title}</h3>
                                </div>
                                <p className="text-xs text-slate-400">{ex.desc}</p>
                              </div>

                              <div className="flex items-center gap-1.5 self-start shrink-0 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button
                                  onClick={() => updateState(block.id, ex.id, 'easy')}
                                  className={`px-2.5 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer ${
                                    ex.state === 'easy' ? "bg-emerald-600 text-white font-bold" : "text-slate-400 hover:text-emerald-300"
                                  }`}
                                >
                                  🟢 Fácil
                                </button>
                                <button
                                  onClick={() => updateState(block.id, ex.id, 'doubt')}
                                  className={`px-2.5 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer ${
                                    ex.state === 'doubt' ? "bg-amber-600 text-white font-bold" : "text-slate-400 hover:text-amber-300"
                                  }`}
                                >
                                  🟡 Dudas
                                </button>
                                <button
                                  onClick={() => updateState(block.id, ex.id, 'pending')}
                                  className={`px-2 py-1 text-xs font-medium rounded-lg transition-all cursor-pointer ${
                                    ex.state === 'pending' ? "bg-slate-700 text-slate-200" : "text-slate-500 hover:text-slate-300"
                                  }`}
                                >
                                  ⚪ Pendiente
                                </button>
                              </div>
                            </div>

                            <div className="mb-3.5 p-4 rounded-xl bg-white border border-slate-300 shadow-md text-slate-900">
                              <MathText text={ex.statement} />
                            </div>

                            <textarea
                              placeholder="Añadir observaciones o dudas sobre la resolución..."
                              value={ex.comment}
                              onChange={(e) => updateComment(block.id, ex.id, e.target.value)}
                              className="w-full text-xs bg-slate-950/70 border border-slate-800 rounded-lg p-2.5 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors resize-y min-h-[50px]"
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* SECCIÓN 2: VISTA DEL FINAL (PRÓXIMAMENTE) */}
            {examType === 'final' && (
              <div className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-12 text-center space-y-4">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-3xl">
                  🚀
                </div>
                <h3 className="text-xl font-bold text-white">Preparador de Examen Final - Próximamente</h3>
                <p className="text-slate-400 text-sm max-w-md mx-auto">
                  Aquí cargaremos la lista acumulativa de bloques del examen final para {getSubjectName()} cuando empieces a preparar la convocatoria.
                </p>
              </div>
            )}

            {/* SECCIÓN 3: CALCULADORA DE NOTAS POR ASIGNATURA */}
            {examType === 'grades' && (
              <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 sm:p-8 space-y-6">
                <div>
                  <h3 className="text-lg font-bold text-white mb-1">Cálculo de Notas de {getSubjectName()}</h3>
                  <p className="text-xs text-slate-400">Ponderación estimada: 20% Evaluació Continuada + 30% Parcial + 50% Examen Final.</p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Nota Evaluació Continuada</label>
                    <input 
                      type="number" 
                      placeholder="Ej: 7.5"
                      value={continuaNote} 
                      onChange={e => setContinuaNote(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Nota Examen Parcial</label>
                    <input 
                      type="number" 
                      placeholder="Ej: 6.0"
                      value={parcialNote} 
                      onChange={e => setParcialNote(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Objetivo Nota Final de la Asignatura</label>
                    <input 
                      type="number" 
                      placeholder="5.0"
                      value={targetGrade} 
                      onChange={e => setTargetGrade(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <button 
                  onClick={calculateNeededGrade}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg text-sm cursor-pointer"
                >
                  🧮 Calcular nota necesaria en el examen final
                </button>

                {finalNeeded !== null && (
                  <div className="p-4 bg-indigo-950/50 border border-indigo-500/30 rounded-xl text-center">
                    <p className="text-xs text-indigo-300 uppercase tracking-wider mb-1">Nota mínima en el Examen Final</p>
                    <p className="text-3xl font-extrabold text-white">{finalNeeded}</p>
                    <p className="text-xs text-slate-400 mt-1">Para aprobar o alcanzar un {targetGrade} en {getSubjectName()}</p>
                  </div>
                )}
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
